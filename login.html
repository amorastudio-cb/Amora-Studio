
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Amora Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F6ECFA, #FFFCFF);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 42px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(100, 27, 67, .09);
        }

        .logo {
            text-align: center;
            color: #641B43;
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #706A73;
            font-size: 13px;
            margin-bottom: 32px;
        }

        h1 {
            color: #641B43;
            font-size: 24px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #514751;
            font-size: 12px;
            margin: 17px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #E5D9E9;
            border-radius: 9px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: #873B83;
            box-shadow: 0 0 0 3px rgba(135, 59, 131, .10);
        }

        .forgot {
            display: block;
            text-align: right;
            margin: 12px 0 22px;
            font-size: 11px;
            color: #873B83;
            text-decoration: none;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 14px;
            background: #641B43;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #873B83;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 18px;
        }

        .message.success {
            display: block;
            background: #EAF7EF;
            color: #21643A;
        }

        .message.error {
            display: block;
            background: #FCECEC;
            color: #9B2929;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #706A73;
        }

        a {
            color: #873B83;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 23px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">Amora Studio 🍇</div>
        <p class="subtitle">Que bom ter você por aqui!</p>

        <h1>Entrar na sua conta</h1>

        <form id="loginForm">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                autocomplete="email"
                required
                placeholder="seuemail@exemplo.com"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                autocomplete="current-password"
                required
                placeholder="Digite sua senha"
            >

            <a class="forgot" href="recuperar-senha.html">
                Esqueceu sua senha?
            </a>

            <button type="submit" id="botaoLogin">
                Entrar
            </button>

            <div
                id="mensagem"
                class="message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <p class="register">
            Ainda não tem uma conta?
            <a href="cadastro.html">Criar conta</a>
        </p>

        <a class="back" href="index.html">← Voltar ao início</a>

    </main>

    <script type="module">
        import { supabase } from "./supabase.js";

        const form = document.getElementById("loginForm");
        const botao = document.getElementById("botaoLogin");
        const mensagem = document.getElementById("mensagem");

        let redirecionando = false;

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = "message " + tipo;
        }

        // Se já estiver autenticado, não precisa fazer login novamente.
        async function verificarSessao() {
            try {
                const { data, error } =
                    await supabase.auth.getSession();

                if (error) {
                    throw error;
                }

                if (data.session) {
                    redirecionando = true;
                    window.location.replace("painel.html");
                }

            } catch (error) {
                console.error("Erro ao verificar sessão:", error);
            }
        }

        verificarSessao();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (redirecionando) return;

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            botao.disabled = true;
            botao.textContent = "Entrando...";

            try {
                const { data, error } =
                    await supabase.auth.signInWithPassword({
                        email,
                        password: senha
                    });

                if (error) {
                    throw error;
                }

                if (!data.user || !data.session) {
                    throw new Error(
                        "Não foi possível identificar sua conta."
                    );
                }

                redirecionando = true;

                mostrarMensagem(
                    "Login realizado com sucesso! Redirecionando...",
                    "success"
                );

                window.location.replace("painel.html");

            } catch (error) {
                console.error("Erro no login:", error);

                let texto =
                    "E-mail ou senha incorretos. Verifique seus dados.";

                if (
                    error.message?.toLowerCase().includes("email not confirmed")
                ) {
                    texto = "Confirme seu e-mail antes de entrar.";
                }

                mostrarMensagem(texto, "error");

                botao.disabled = false;
                botao.textContent = "Entrar";
            }
        });
    </script>

</body>
</html>
