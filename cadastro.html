
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Amora Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F6ECFA, #FFFCFF);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 42px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(100, 27, 67, .09);
        }

        .logo {
            text-align: center;
            color: #641B43;
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #706A73;
            font-size: 13px;
            margin-bottom: 30px;
        }

        h1 {
            color: #641B43;
            font-size: 23px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #514751;
            font-size: 12px;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #E5D9E9;
            border-radius: 9px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: #873B83;
            box-shadow: 0 0 0 3px rgba(135, 59, 131, .10);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 20px 0;
            font-size: 11px;
            color: #706A73;
            line-height: 1.6;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        a {
            color: #873B83;
            text-decoration: none;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 14px;
            background: #641B43;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #873B83;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 18px;
        }

        .message.success {
            display: block;
            background: #EAF7EF;
            color: #21643A;
        }

        .message.error {
            display: block;
            background: #FCECEC;
            color: #9B2929;
        }

        .login {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #706A73;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 23px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">Amora Studio 🍇</div>
        <p class="subtitle">Suas ideias merecem ganhar forma.</p>

        <h1>Crie sua conta</h1>

        <form id="cadastroForm">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                autocomplete="name"
                required
                placeholder="Digite seu nome"
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                autocomplete="email"
                required
                placeholder="seuemail@exemplo.com"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                autocomplete="new-password"
                minlength="6"
                required
                placeholder="Mínimo de 6 caracteres"
            >

            <label for="confirmarSenha">Confirmar senha</label>
            <input
                type="password"
                id="confirmarSenha"
                autocomplete="new-password"
                minlength="6"
                required
                placeholder="Digite a senha novamente"
            >

            <div class="terms">
                <input type="checkbox" id="aceite" required>
                <span>
                    Li e concordo com os
                    <a href="termos.html" target="_blank">Termos de Uso</a>
                    e a
                    <a href="privacidade.html" target="_blank">Política de Privacidade</a>.
                </span>
            </div>

            <button type="submit" id="botaoCadastro">
                Criar minha conta
            </button>

            <div
                id="mensagem"
                class="message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <p class="login">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>

        <a class="back" href="index.html">← Voltar ao início</a>

    </main>

    <script type="module">
        import { supabase } from "./supabase.js";

        const form = document.getElementById("cadastroForm");
        const botao = document.getElementById("botaoCadastro");
        const mensagem = document.getElementById("mensagem");

        let enviando = false;

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = "message " + tipo;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (enviando) return;

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const confirmarSenha =
                document.getElementById("confirmarSenha").value;

            if (!nome) {
                mostrarMensagem("Digite seu nome completo.", "error");
                return;
            }

            if (senha !== confirmarSenha) {
                mostrarMensagem("As senhas não coincidem.", "error");
                return;
            }

            if (senha.length < 6) {
                mostrarMensagem(
                    "A senha precisa ter pelo menos 6 caracteres.",
                    "error"
                );
                return;
            }

            if (!supabase) {
                mostrarMensagem(
                    "Não foi possível conectar ao sistema. Confira a configuração do Supabase.",
                    "error"
                );
                return;
            }

            enviando = true;
            botao.disabled = true;
            botao.textContent = "Criando sua conta...";

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: senha,
                    options: {
                        data: {
                            nome: nome,
                            full_name: nome
                        }
                    }
                });

                if (error) throw error;

                if (data.session) {
                    mostrarMensagem(
                        "Conta criada com sucesso! Sua conta já está pronta para uso. Você pode entrar no painel.",
                        "success"
                    );
                } else {
                    mostrarMensagem(
                        "Cadastro realizado! Confira sua caixa de entrada para confirmar o e-mail antes de entrar.",
                        "success"
                    );
                }

                form.reset();

            } catch (error) {
                console.error("Erro no cadastro:", error);

                let texto =
                    "Não foi possível criar sua conta. Tente novamente.";

                const erro = error.message?.toLowerCase() || "";

                if (
                    erro.includes("already registered") ||
                    erro.includes("already exists")
                ) {
                    texto =
                        "Este e-mail já possui uma conta cadastrada. Experimente entrar.";
                } else if (erro.includes("password")) {
                    texto =
                        "A senha não atende aos requisitos do sistema.";
                } else if (erro.includes("email")) {
                    texto =
                        "Verifique se o endereço de e-mail está correto.";
                }

                mostrarMensagem(texto, "error");

            } finally {
                enviando = false;
                botao.disabled = false;
                botao.textContent = "Criar minha conta";
            }
        });
    </script>

</body>
</html>
