
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | Amora Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Nova senha</h1>
            <p>Escolha uma nova senha para sua conta.</p>

            <form id="formSenha">
                <label for="senha">Nova senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua nova senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmarSenha">Confirme a nova senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite novamente"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="botaoSalvar">
                    Salvar nova senha
                </button>

                <p id="mensagem" role="status" aria-live="polite"></p>
            </form>

            <a href="login.html">Voltar para o login</a>
        </section>
    </main>

    <script type="module">
        import { supabase } from "./supabase.js";

        const formulario = document.getElementById("formSenha");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("botaoSalvar");

        let sessaoValida = false;

        async function verificarSessaoRecuperacao() {
            try {
                const { data, error } =
                    await supabase.auth.getSession();

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    mensagem.textContent =
                        "O link de recuperação é inválido ou expirou. Solicite outro pelo login.";

                    formulario.querySelectorAll("input, button").forEach(elemento => {
                        elemento.disabled = true;
                    });

                    return;
                }

                sessaoValida = true;

            } catch (error) {
                console.error("Erro ao verificar sessão:", error);

                mensagem.textContent =
                    "Não foi possível validar o link. Solicite uma nova recuperação de senha.";

                formulario.querySelectorAll("input, button").forEach(elemento => {
                    elemento.disabled = true;
                });
            }
        }

        verificarSessaoRecuperacao();

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            if (!sessaoValida) {
                mensagem.textContent =
                    "Aguarde a validação do link ou solicite uma nova recuperação de senha.";
                return;
            }

            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmarSenha").value;

            if (senha.length < 6) {
                mensagem.textContent =
                    "A senha precisa ter pelo menos 6 caracteres.";
                return;
            }

            if (senha !== confirmar) {
                mensagem.textContent = "As senhas não são iguais.";
                return;
            }

            botao.disabled = true;
            mensagem.textContent = "Atualizando sua senha...";

            try {
                const { data, error: erroSessao } =
                    await supabase.auth.getSession();

                if (erroSessao || !data.session) {
                    throw new Error(
                        "O link de recuperação é inválido ou expirou. Solicite outro pelo login."
                    );
                }

                const { error } = await supabase.auth.updateUser({
                    password: senha
                });

                if (error) {
                    throw error;
                }

                mensagem.textContent =
                    "Senha alterada com sucesso! Você já pode entrar.";

                formulario.reset();

                // A sessão não é encerrada automaticamente.
                // O usuário poderá sair normalmente pelo botão Sair da conta.

            } catch (error) {
                console.error("Erro ao atualizar senha:", error);

                mensagem.textContent =
                    error.message || "Não foi possível alterar sua senha. Tente novamente.";

            } finally {
                botao.disabled = false;
            }
        });
    </script>

</body>
</html>
