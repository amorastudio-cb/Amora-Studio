
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | Amora Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Nova senha</h1>
            <p>Escolha uma nova senha para sua conta.</p>

            <form id="formSenha">
                <label for="senha">Nova senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua nova senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmarSenha">Confirme a nova senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite novamente"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="botaoSalvar" disabled>
                    Validando link...
                </button>

                <p id="mensagem" role="status" aria-live="polite"></p>
            </form>

            <a href="login.html">Voltar para o login</a>
        </section>
    </main>

    <script type="module">
        import { supabase } from "./supabase.js";

        const formulario = document.getElementById("formSenha");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("botaoSalvar");

        let sessaoValida = false;
        let atualizando = false;
        let senhaAlterada = false;

        function mostrarMensagem(texto) {
            mensagem.textContent = texto;
        }

        function bloquearFormulario(texto) {
            sessaoValida = false;
            mostrarMensagem(texto);

            formulario.querySelectorAll("input, button").forEach(elemento => {
                elemento.disabled = true;
            });
        }

        async function verificarSessaoRecuperacao() {
            try {
                const { data, error } =
                    await supabase.auth.getSession();

                if (error) throw error;

                if (!data.session) {
                    bloquearFormulario(
                        "O link de recuperação é inválido ou expirou. Solicite outro pelo login."
                    );
                    return;
                }

                sessaoValida = true;
                botao.disabled = false;
                botao.textContent = "Salvar nova senha";

                mostrarMensagem(
                    "Link validado! Você já pode escolher sua nova senha."
                );

            } catch (error) {
                console.error("Erro ao verificar sessão:", error);

                bloquearFormulario(
                    "Não foi possível validar o link. Solicite uma nova recuperação de senha."
                );
            }
        }

        supabase.auth.onAuthStateChange((evento, sessao) => {
            if (
                evento === "SIGNED_OUT" ||
                (evento === "TOKEN_REFRESHED" && !sessao)
            ) {
                bloquearFormulario(
                    "Sua sessão expirou. Solicite um novo link de recuperação."
                );
            }
        });

        verificarSessaoRecuperacao();

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            if (atualizando || senhaAlterada) return;

            if (!sessaoValida) {
                mostrarMensagem(
                    "Aguarde a validação do link ou solicite uma nova recuperação de senha."
                );
                return;
            }

            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmarSenha").value;

            if (senha.length < 6) {
                mostrarMensagem(
                    "A senha precisa ter pelo menos 6 caracteres."
                );
                return;
            }

            if (senha !== confirmar) {
                mostrarMensagem("As senhas não são iguais.");
                return;
            }

            atualizando = true;
            botao.disabled = true;
            botao.textContent = "Atualizando...";

            try {
                const { data, error: erroSessao } =
                    await supabase.auth.getSession();

                if (erroSessao) throw erroSessao;

                if (!data.session) {
                    throw new Error(
                        "O link de recuperação é inválido ou expirou. Solicite outro pelo login."
                    );
                }

                const { error } = await supabase.auth.updateUser({
                    password: senha
                });

                if (error) throw error;

                senhaAlterada = true;
                sessaoValida = false;

                mostrarMensagem(
                    "Senha alterada com sucesso! Você já pode entrar com sua nova senha."
                );

                formulario.reset();

                formulario.querySelectorAll("input").forEach(elemento => {
                    elemento.disabled = true;
                });

                botao.textContent = "Senha alterada";

            } catch (error) {
                console.error("Erro ao atualizar senha:", error);

                mostrarMensagem(
                    error.message ||
                    "Não foi possível alterar sua senha. Tente novamente."
                );

                botao.disabled = false;
                botao.textContent = "Salvar nova senha";

            } finally {
                atualizando = false;
            }
        });
    </script>

</body>
</html>
